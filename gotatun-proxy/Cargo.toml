[package]
name = "gotatun-proxy"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
eyre = { workspace = true }
gotatun = { workspace = true, features = ["aws-lc-rs", "device"] }
ipnetwork = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-tcp-reno", "async",
] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
